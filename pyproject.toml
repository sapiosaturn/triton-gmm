[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-gmm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "triton>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
]
bench = [
  "pandas>=2.2",
  "tabulate>=0.9",
]

[tool.setuptools.packages.find]
include = ["triton_gmm*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
